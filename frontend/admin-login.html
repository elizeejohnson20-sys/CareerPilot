<!DOCTYPE html>
<html>

<head>
    <title>Admin Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

    <h2>Admin Login</h2>

    <input
        type="email"
        id="email"
        placeholder="Enter Admin Email">

    <br><br>

    <input
        type="password"
        id="password"
        placeholder="Enter Password">

    <br><br>

    <button onclick="adminLogin()">
        Login
    </button>

</div>

<script src="js/admin-login.js"></script>

</body>
</html>
