<!DOCTYPE html>
<html>

<head>

    <title>Add Company</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav class="navbar">

    <h2>CareerPilot Admin</h2>

</nav>

<div class="container">

    <h2>Add New Company</h2>

    <input
        type="text"
        id="company_name"
        placeholder="Company Name">

    <br><br>

    <input
        type="text"
        id="location"
        placeholder="Location">

    <br><br>

    <input
        type="number"
        id="package_lpa"
        placeholder="Package (LPA)">

    <br><br>

    <input
        type="number"
        id="eligibility_cgpa"
        placeholder="Eligibility CGPA">

    <br><br>

    <button onclick="addCompany()">
        Add Company
    </button>

</div>

<script src="js/add-company.js"></script>

</body>

</html>
