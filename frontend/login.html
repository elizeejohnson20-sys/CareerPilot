<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CareerPilot Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div class="container">

<h1>CareerPilot</h1>

<h2>Login</h2>

<form id="loginForm">

<label>Email</label>

<input
type="email"
id="email"
placeholder="Enter your email">

<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter your password">

<button type="submit">

Login

</button>

</form>

</div>

<script src="js/login.js"></script>

</body>

</html>
