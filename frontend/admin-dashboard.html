<!DOCTYPE html>
<html>

<head>

    <title>CareerPilot Admin Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav class="navbar">

    <h2>CareerPilot Admin</h2>

    <div class="menu">

        <a href="admin-dashboard.html">Dashboard</a>
        <a href="manage-companies.html">Companies</a>
        <a href="admin-students.html">Students</a>
        <a href="admin-application.html">Applications</a>
        <a href="#" onclick="logout()">Logout</a>

    </div>

</nav>

<div class="container">

    <h1>Admin Dashboard</h1>

    <div class="dashboard-cards">

        <div class="dashboard-card">

            <h3>Total Students</h3>

            <h1 id="students">0</h1>

        </div>

        <div class="dashboard-card">

            <h3>Total Companies</h3>

            <h1 id="companies">0</h1>

        </div>

        <div class="dashboard-card">

            <h3>Total Applications</h3>

            <h1 id="applications">0</h1>

        </div>

    </div>

    <h2>Quick Actions</h2>

    <div class="dashboard-buttons">

        <button onclick="window.location.href='manage-companies.html'">
            Manage Companies
        </button>

        <button onclick="window.location.href='admin-students.html'">
            View Students
        </button>

        <button onclick="window.location.href='admin-application.html'">
            View Applications
        </button>

    </div>

</div>

<script src="js/admin-dashboard.js"></script>

</body>

</html>
